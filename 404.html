<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa bulunamadı | Fettahoğlu Sigorta</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#122238">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--ink:#122238;--paper:#f7f5f0;--brass:#b07d2b;--brass-light:#d9a648;--text:#31435c;--muted:#6b7a8f;--line:#dcd6ca}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--paper);color:var(--text);line-height:1.65;
  min-height:100vh;display:grid;place-items:center;padding:32px 24px;
}
.box{max-width:520px;text-align:center}
/* Logo — favicon.svg ile birebir aynı işaret. Favicon değişirse burayı da güncelleyin. */
.logo{width:88px;height:88px;display:block;margin:0 auto 28px}
h1{font-family:Georgia,serif;color:var(--ink);font-size:clamp(26px,5vw,34px);margin-bottom:14px}
p{color:var(--muted);margin-bottom:28px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{
  text-decoration:none;font-weight:600;font-size:15px;
  padding:13px 26px;border-radius:999px;display:inline-block;
}
a.gold{background:var(--brass);color:#fff}
a.ghost{border:1.5px solid var(--line);color:var(--ink)}
a.btn:hover{opacity:.88}
.foot{margin-top:34px;font-size:13px;color:var(--muted)}
.foot a{color:var(--brass);font-weight:600}
</style>
</head>
<body>
  <div class="box">
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Fettahoğlu Sigorta">
      <rect width="64" height="64" rx="13" fill="#122238"/>
      <circle cx="32" cy="32" r="24.5" fill="none" stroke="#b07d2b" stroke-width="2.5"/>
      <text x="32" y="44.5" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32"
            fill="#d9a648">F</text>
    </svg>
    <h1>Aradığınız sayfayı bulamadık</h1>
    <p>Bağlantı taşınmış veya adres yanlış yazılmış olabilir. Ana sayfadan devam edebilir ya da doğrudan bize ulaşabilirsiniz.</p>
    <div class="actions">
      <a class="btn gold" href="/">Ana sayfaya dön</a>
      <a class="btn ghost" href="tel:+903288765125">Bizi arayın</a>
    </div>
    <p class="foot">
      Fettahoğlu Sigorta · Düziçi / Osmaniye ·
      <a href="/#iletisim">İletişim</a>
    </p>
  </div>
</body>
</html>
